<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 1rem;
      text-align: center;
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 2rem;
      padding: 1rem;
      background-color: #f5f5f5;
      border-radius: 5px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #667eea;
    }
    
    .stat-label {
      color: #666;
      font-size: 0.9rem;
    }
    
    .add-task {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    
    input {
      flex: 1;
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      padding: 0.75rem 1.5rem;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #764ba2;
    }
    
    .filter-buttons {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .filter-buttons button {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.9rem;
    }
    
    .filter-buttons button.active {
      background-color: #764ba2;
    }
    
    .tasks {
      list-style: none;
    }
    
    .task {
      display: flex;
      align-items: center;
      padding: 1rem;
      margin-bottom: 0.5rem;
      background-color: #f9f9f9;
      border-radius: 5px;
      border-left: 4px solid #667eea;
      transition: all 0.3s;
    }
    
    .task.completed {
      border-left-color: #4caf50;
      opacity: 0.7;
    }
    
    .task.completed .task-title {
      text-decoration: line-through;
      color: #999;
    }
    
    .task-checkbox {
      width: 20px;
      height: 20px;
      margin-right: 1rem;
      cursor: pointer;
    }
    
    .task-title {
      flex: 1;
      font-size: 1rem;
    }
    
    .task-actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .btn-delete {
      background-color: #f44336;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }
    
    .btn-delete:hover {
      background-color: #da190b;
    }
    
    .btn-clear {
      background-color: #ff9800;
      width: 100%;
      margin-top: 1rem;
    }
    
    .btn-clear:hover {
      background-color: #e68900;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #999;
    }
    
    .timestamp {
      font-size: 0.8rem;
      color: #999;
      margin-right: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-value" id="total-tasks">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="completed-tasks">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="incomplete-tasks">0</div>
        <div class="stat-label">To Do</div>
      </div>
    </div>
    
    <div class="add-task">
      <input 
        type="text" 
        id="task-input" 
        placeholder="Add a new task..."
        onkeypress="if(event.key==='Enter') addTask()">
      <button onclick="addTask()">Add Task</button>
    </div>
    
    <div class="filter-buttons">
      <button class="active" onclick="filterTasks('all')">All</button>
      <button onclick="filterTasks('active')">Active</button>
      <button onclick="filterTasks('completed')">Completed</button>
    </div>
    
    <ul class="tasks" id="task-list"></ul>
    
    <button class="btn-clear" onclick="clearCompleted()">Clear Completed Tasks</button>
  </div>
  
  <script>
    let currentFilter = 'all';
    
    // Load tasks when page loads
    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      loadStats();
    });
    
    // Fetch and display all tasks
    async function loadTasks() {
      try {
        let url = '/api/tasks';
        
        if (currentFilter === 'active') {
          url += '?completed=false';
        } else if (currentFilter === 'completed') {
          url += '?completed=true';
        }
        
        const response = await fetch(url);
        const data = await response.json();
        
        displayTasks(data.tasks);
      } catch (error) {
        console.error('Error loading tasks:', error);
      }
    }
    
    // Display tasks in the UI
    function displayTasks(tasks) {
      const taskList = document.getElementById('task-list');
      
      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state">No tasks found. Add one above!</div>';
        return;
      }
      
      taskList.innerHTML = tasks.map(task => `
        <li class="task ${task.completed ? 'completed' : ''}">
          <input 
            type="checkbox" 
            class="task-checkbox" 
            ${task.completed ? 'checked' : ''}
            onchange="toggleTask(${task.id})">
          <span class="task-title">${task.title}</span>
          <span class="timestamp">#${task.id}</span>
          <div class="task-actions">
            <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
          </div>
        </li>
      `).join('');
    }
    
    // Load statistics
    async function loadStats() {
      try {
        const response = await fetch('/api/stats');
        const data = await response.json();
        
        document.getElementById('total-tasks').textContent = data.stats.total;
        document.getElementById('completed-tasks').textContent = data.stats.completed;
        document.getElementById('incomplete-tasks').textContent = data.stats.incomplete;
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }
    
    // Add new task
    async function addTask() {
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      
      if (!title) {
        alert('Please enter a task title');
        return;
      }
      
      try {
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title })
        });
        
        const data = await response.json();
        
        if (data.success) {
          input.value = '';
          loadTasks();
          loadStats();
        } else {
          alert('Error: ' + data.error);
        }
      } catch (error) {
        console.error('Error adding task:', error);
        alert('Failed to add task');
      }
    }
    
    // Toggle task completion
    async function toggleTask(id) {
      try {
        const response = await fetch(`/api/tasks/${id}/toggle`, {
          method: 'PATCH'
        });
        
        const data = await response.json();
        
        if (data.success) {
          loadTasks();
          loadStats();
        }
      } catch (error) {
        console.error('Error toggling task:', error);
      }
    }
    
    // Delete task
    async function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) {
        return;
      }
      
      try {
        const response = await fetch(`/api/tasks/${id}`, {
          method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (data.success) {
          loadTasks();
          loadStats();
        }
      } catch (error) {
        console.error('Error deleting task:', error);
      }
    }
    
    // Filter tasks
    function filterTasks(filter) {
      currentFilter = filter;
      
      // Update active button
      document.querySelectorAll('.filter-buttons button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      
      loadTasks();
    }
    
    // Clear completed tasks
    async function clearCompleted() {
      if (!confirm('Delete all completed tasks?')) {
        return;
      }
      
      try {
        const response = await fetch('/api/tasks/completed/all', {
          method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert(data.message);
          loadTasks();
          loadStats();
        }
      } catch (error) {
        console.error('Error clearing completed tasks:', error);
      }
    }
  </script>
</body>
</html>
