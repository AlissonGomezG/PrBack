<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles for the form */
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 500px;
      margin: 2rem auto;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
    }
    
    label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #333;
    }
    
    input, textarea {
      padding: 0.75rem;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    
    button[type="submit"] {
      background-color: #667eea;
      color: white;
      padding: 1rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button[type="submit"]:hover {
      background-color: #764ba2;
    }
    
    .required {
      color: red;
    }
    
    .api-section {
      margin-top: 3rem;
      padding: 2rem;
      background-color: #f5f5f5;
      border-radius: 5px;
    }
    
    #api-result {
      margin-top: 1rem;
      padding: 1rem;
      background-color: white;
      border-radius: 5px;
      border-left: 4px solid #667eea;
    }
  </style>
</head>
<body>
  <div style="max-width: 800px; margin: 0 auto; padding: 2rem;">
    <h1>Contact Us</h1>
    
    <h2>Method 1: HTML Form Submission</h2>
    <form action="/submit-form" method="POST">
      <div class="form-group">
        <label for="name">Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          required 
          placeholder="Enter your name">
      </div>
      
      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="your.email@example.com">
      </div>
      
      <div class="form-group">
        <label for="message">Message <span class="required">*</span></label>
        <textarea 
          id="message" 
          name="message" 
          required 
          placeholder="Type your message here..."></textarea>
      </div>
      
      <button type="submit">Submit Form</button>
    </form>
    
    <div class="api-section">
      <h2>Method 2: JavaScript Fetch (API)</h2>
      <p>This method sends data using JavaScript without refreshing the page.</p>
      
      <button onclick="submitViaAPI()">Submit Test Data via API</button>
      <button onclick="viewSubmissions()">View All Submissions</button>
      <button onclick="clearSubmissions()">Clear All Submissions</button>
      
      <div id="api-result"></div>
    </div>
  </div>
  
  <script>
    // Submit form using JavaScript fetch API
    async function submitViaAPI() {
      const data = {
        name: 'Test User',
        email: 'test@example.com',
        message: 'This is a test message sent via JavaScript!'
      };
      
      try {
        const response = await fetch('/api/contact', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        document.getElementById('api-result').innerHTML = `
          <h3>Response:</h3>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
      } catch (error) {
        document.getElementById('api-result').innerHTML = `
          <h3>Error:</h3>
          <p>${error.message}</p>
        `;
      }
    }
    
    // View all submissions
    async function viewSubmissions() {
      try {
        const response = await fetch('/api/submissions');
        const data = await response.json();
        
        document.getElementById('api-result').innerHTML = `
          <h3>All Submissions (${data.count}):</h3>
          <pre>${JSON.stringify(data.submissions, null, 2)}</pre>
        `;
      } catch (error) {
        document.getElementById('api-result').innerHTML = `
          <h3>Error:</h3>
          <p>${error.message}</p>
        `;
      }
    }
    
    // Clear all submissions
    async function clearSubmissions() {
      try {
        const response = await fetch('/api/submissions', {
          method: 'DELETE'
        });
        
        const data = await response.json();
        
        document.getElementById('api-result').innerHTML = `
          <h3>Success:</h3>
          <p>${data.message}</p>
        `;
      } catch (error) {
        document.getElementById('api-result').innerHTML = `
          <h3>Error:</h3>
          <p>${error.message}</p>
        `;
      }
    }
  </script>
</body>
</html>
